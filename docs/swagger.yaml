basePath: /
definitions:
  models.Booking:
    properties:
      comfort_sharing:
        example: true
        type: boolean
      created_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      end_time:
        example: "2026-06-03T12:00:00Z"
        type: string
      id:
        example: 507f1f77bcf86cd799439011
        type: string
      is_shared:
        example: false
        type: boolean
      min_entry_time:
        example: "2026-06-03T10:30:00Z"
        type: string
      party_size:
        example: 4
        maximum: 20
        minimum: 1
        type: integer
      start_time:
        example: "2026-06-03T10:00:00Z"
        type: string
      status:
        enum:
        - pending
        - checked_in
        - cancelled
        example: pending
        type: string
      table_id:
        example: 507f1f77bcf86cd799439012
        type: string
      updated_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      user_email:
        example: customer@example.com
        type: string
      user_name:
        example: Jane Doe
        type: string
      user_phone:
        example: "+919876543210"
        type: string
    required:
    - end_time
    - party_size
    - start_time
    - table_id
    - user_email
    type: object
  models.BookingCreateRequest:
    properties:
      comfort_sharing:
        example: true
        type: boolean
      end_time:
        example: "2026-06-03T12:00:00Z"
        type: string
      is_shared:
        example: false
        type: boolean
      party_size:
        example: 4
        maximum: 20
        minimum: 1
        type: integer
      start_time:
        example: "2026-06-03T10:00:00Z"
        type: string
      table_id:
        example: 507f1f77bcf86cd799439012
        type: string
    required:
    - end_time
    - party_size
    - start_time
    - table_id
    type: object
  models.BookingResponse:
    properties:
      booking:
        $ref: '#/definitions/models.Booking'
      id:
        example: 507f1f77bcf86cd799439019
        type: string
      message:
        example: Booking created successfully
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error:
        example: Error message here
        type: string
    type: object
  models.Food:
    properties:
      created_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      description:
        example: Delicious dish
        type: string
      food_image:
        example: https://example.com/images/chicken.jpg
        type: string
      id:
        example: 507f1f77bcf86cd799439011
        type: string
      image_base64:
        description: Base64 data for photo uploads
        type: string
      image_file_id:
        example: file_id_here
        type: string
      menu_id:
        example: 507f1f77bcf86cd799439011
        type: string
      name:
        example: Grilled Chicken
        maxLength: 100
        minLength: 2
        type: string
      price:
        example: 150
        type: number
      updated_at:
        example: "2024-01-01T00:00:00Z"
        type: string
    required:
    - food_image
    - menu_id
    - name
    - price
    type: object
  models.FoodResponse:
    properties:
      food:
        $ref: '#/definitions/models.Food'
      id:
        example: 507f1f77bcf86cd799439011
        type: string
      message:
        example: Food created successfully
        type: string
    type: object
  models.Invoice:
    properties:
      created_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      id:
        example: 507f1f77bcf86cd799439011
        type: string
      order_id:
        example: 507f1f77bcf86cd799439012
        type: string
      payment_method:
        enum:
        - cash
        - credit_card
        - debit_card
        - mobile_payment
        example: credit_card
        type: string
      payment_status:
        enum:
        - pending
        - paid
        - failed
        - refunded
        example: paid
        type: string
      total_amount:
        example: 45.99
        type: number
      updated_at:
        example: "2024-01-01T00:00:00Z"
        type: string
    required:
    - order_id
    - payment_method
    - payment_status
    - total_amount
    type: object
  models.InvoiceCreateRequest:
    properties:
      order_id:
        example: 507f1f77bcf86cd799439012
        type: string
      payment_method:
        enum:
        - cash
        - credit_card
        - debit_card
        - mobile_payment
        example: credit_card
        type: string
      payment_status:
        enum:
        - pending
        - paid
        - failed
        - refunded
        example: paid
        type: string
      total_amount:
        example: 450
        type: number
    required:
    - order_id
    - payment_method
    - payment_status
    - total_amount
    type: object
  models.InvoiceResponse:
    properties:
      id:
        example: 507f1f77bcf86cd799439018
        type: string
      invoice:
        $ref: '#/definitions/models.Invoice'
      message:
        example: Invoice fetched successfully
        type: string
    type: object
  models.LoginRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      password:
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  models.LoginResponse:
    properties:
      message:
        example: Login successful
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/models.UserSummary'
    type: object
  models.Menu:
    properties:
      category:
        example: Main Course
        type: string
      created_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      end_date:
        example: "2024-12-31T23:59:59Z"
        type: string
      id:
        example: 507f1f77bcf86cd799439011
        type: string
      name:
        example: Dinner Menu
        type: string
      start_date:
        example: "2024-01-01T00:00:00Z"
        type: string
      updated_at:
        example: "2024-01-01T00:00:00Z"
        type: string
    required:
    - category
    - name
    type: object
  models.MenuCreateRequest:
    properties:
      category:
        example: Main Course
        type: string
      end_date:
        example: "2024-12-31T23:59:59Z"
        type: string
      name:
        example: Dinner Menu
        type: string
      start_date:
        example: "2024-01-01T00:00:00Z"
        type: string
    required:
    - category
    - name
    type: object
  models.MenuResponse:
    properties:
      id:
        example: 507f1f77bcf86cd799439014
        type: string
      menu:
        $ref: '#/definitions/models.Menu'
      message:
        example: Menu fetched successfully
        type: string
    type: object
  models.Order:
    properties:
      created_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      food_items:
        items:
          $ref: '#/definitions/models.OrderItemNested'
        type: array
      id:
        example: 507f1f77bcf86cd799439011
        type: string
      order_date:
        example: "2024-01-01T12:00:00Z"
        type: string
      status:
        enum:
        - pending
        - preparing
        - ready
        - delivered
        - cancelled
        example: pending
        type: string
      table_id:
        example: 507f1f77bcf86cd799439012
        type: string
      updated_at:
        example: "2024-01-01T00:00:00Z"
        type: string
    required:
    - status
    - table_id
    type: object
  models.OrderCreateRequest:
    properties:
      status:
        enum:
        - pending
        - preparing
        - ready
        - delivered
        - cancelled
        example: pending
        type: string
      table_id:
        example: 507f1f77bcf86cd799439012
        type: string
    required:
    - status
    - table_id
    type: object
  models.OrderItem:
    properties:
      created_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      food_id:
        example: 507f1f77bcf86cd799439013
        type: string
      id:
        example: 507f1f77bcf86cd799439011
        type: string
      order_id:
        example: 507f1f77bcf86cd799439012
        type: string
      quantity:
        example: 2
        minimum: 1
        type: integer
      unit_price:
        example: 15.99
        type: number
      updated_at:
        example: "2024-01-01T00:00:00Z"
        type: string
    required:
    - food_id
    - order_id
    - quantity
    - unit_price
    type: object
  models.OrderItemCreateRequest:
    properties:
      food_id:
        example: 507f1f77bcf86cd799439013
        type: string
      order_id:
        example: 507f1f77bcf86cd799439012
        type: string
      quantity:
        example: 2
        minimum: 1
        type: integer
      unit_price:
        example: 150
        type: number
    required:
    - food_id
    - order_id
    - quantity
    - unit_price
    type: object
  models.OrderItemNested:
    properties:
      amount:
        minimum: 1
        type: integer
      id:
        type: string
      unit_price:
        type: number
    required:
    - amount
    - id
    type: object
  models.OrderItemResponse:
    properties:
      id:
        example: 507f1f77bcf86cd799439017
        type: string
      message:
        example: Order item fetched successfully
        type: string
      order_item:
        $ref: '#/definitions/models.OrderItem'
    type: object
  models.OrderResponse:
    properties:
      id:
        example: 507f1f77bcf86cd799439015
        type: string
      message:
        example: Order fetched successfully
        type: string
      order:
        $ref: '#/definitions/models.Order'
    type: object
  models.RefreshRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - refresh_token
    type: object
  models.RefreshResponse:
    properties:
      message:
        example: Token refreshed successfully
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  models.SignupRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      first_name:
        example: John
        maxLength: 100
        minLength: 2
        type: string
      last_name:
        example: Doe
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: password123
        minLength: 6
        type: string
      phone:
        example: "+1234567890"
        type: string
      user_type:
        enum:
        - ADMIN
        - STAFF
        - USER
        example: USER
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - phone
    - user_type
    type: object
  models.SignupResponse:
    properties:
      message:
        example: User created successfully
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.SuccessResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
    type: object
  models.Table:
    properties:
      capacity:
        example: 4
        minimum: 1
        type: integer
      created_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      id:
        example: 507f1f77bcf86cd799439011
        type: string
      is_available:
        example: true
        type: boolean
      number_of_guests:
        example: 4
        type: integer
      seats_reserved:
        example: 2
        type: integer
      status:
        example: vacant
        type: string
      table_number:
        example: 5
        minimum: 1
        type: integer
      updated_at:
        example: "2024-01-01T00:00:00Z"
        type: string
    required:
    - capacity
    - table_number
    type: object
  models.TableCreateRequest:
    properties:
      capacity:
        example: 4
        minimum: 1
        type: integer
      table_number:
        example: 5
        minimum: 1
        type: integer
    required:
    - capacity
    - table_number
    type: object
  models.TableResponse:
    properties:
      id:
        example: 507f1f77bcf86cd799439016
        type: string
      message:
        example: Table fetched successfully
        type: string
      table:
        $ref: '#/definitions/models.Table'
    type: object
  models.User:
    properties:
      created_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      email:
        example: john.doe@example.com
        type: string
      first_name:
        example: John
        maxLength: 100
        minLength: 2
        type: string
      id:
        example: 507f1f77bcf86cd799439011
        type: string
      last_name:
        example: Doe
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: password123
        minLength: 6
        type: string
      phone:
        example: "+1234567890"
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      updated_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      user_type:
        enum:
        - ADMIN
        - STAFF
        - USER
        example: USER
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - phone
    - user_type
    type: object
  models.UserSummary:
    properties:
      email:
        example: john.doe@example.com
        type: string
      first_name:
        example: John
        type: string
      id:
        example: 507f1f77bcf86cd799439011
        type: string
      last_name:
        example: Doe
        type: string
      user_type:
        enum:
        - ADMIN
        - STAFF
        - USER
        example: USER
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@restaurant.com
    name: API Support
  description: This is a restaurant management system API with user authentication,
    food ordering, and invoice management
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Restaurant Management API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password, returns JWT access token
      parameters:
      - description: Email and Password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful with authentication token and user details
          schema:
            $ref: '#/definitions/models.LoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: User Login
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh the current JWT access token using a valid refresh token
      parameters:
      - description: Refresh Token Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Refresh successful with new authentication token and refresh
            token
          schema:
            $ref: '#/definitions/models.RefreshResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Refresh Token
      tags:
      - Authentication
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Register a new user account with email, password, and profile information
      parameters:
      - description: User Registration Details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully with authentication token
          schema:
            $ref: '#/definitions/models.SignupResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Email already exists in the system
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: User Signup
      tags:
      - Authentication
  /auth/user:
    get:
      consumes:
      - application/json
      description: Get authenticated user profile details (requires valid JWT token)
      produces:
      - application/json
      responses:
        "200":
          description: User profile details (password field will be empty)
          schema:
            $ref: '#/definitions/models.UserSummary'
        "401":
          description: Missing or invalid authentication token
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: User not found in database
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Current User
      tags:
      - Authentication
  /bookings:
    get:
      consumes:
      - application/json
      description: Retrieve bookings. Customers see their own bookings, staff/admin
        see all.
      produces:
      - application/json
      responses:
        "200":
          description: List of bookings
          schema:
            items:
              $ref: '#/definitions/models.Booking'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get All Bookings
      tags:
      - Booking
    post:
      consumes:
      - application/json
      description: Customer creates a table booking (soft lock / reservation)
      parameters:
      - description: Booking details
        in: body
        name: booking
        required: true
        schema:
          $ref: '#/definitions/models.BookingCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Booking created successfully
          schema:
            $ref: '#/definitions/models.BookingResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Table not available
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create Booking
      tags:
      - Booking
  /bookings/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific booking by its ID
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Booking details
          schema:
            $ref: '#/definitions/models.Booking'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Booking not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Booking by ID
      tags:
      - Booking
  /bookings/{id}/cancel:
    put:
      consumes:
      - application/json
      description: Cancel a booking. Customers can cancel their own, staff/admin can
        cancel any.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Booking cancelled
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Invalid ID or booking already cancelled
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Access denied
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Booking not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel Booking
      tags:
      - Booking
  /bookings/{id}/check-in:
    put:
      consumes:
      - application/json
      description: Staff/admin verifies and checks in a customer booking (hard lock)
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Booking checked in
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Invalid ID or booking not pending
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Booking not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Check In Booking
      tags:
      - Booking
  /bookings/{id}/min-entry-time:
    put:
      consumes:
      - application/json
      description: Staff/admin shifts the minimum entry time (cutoff time) of a booking
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      - description: New minimum entry time
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.Booking'
      produces:
      - application/json
      responses:
        "200":
          description: Minimum entry time updated successfully
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Booking not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update Minimum Entry Time
      tags:
      - Booking
  /foods:
    get:
      consumes:
      - application/json
      description: Retrieve a complete list of all available food items in the restaurant
      produces:
      - application/json
      responses:
        "200":
          description: Array of all food items with details
          schema:
            items:
              $ref: '#/definitions/models.FoodResponse'
            type: array
        "401":
          description: Missing or invalid authentication token
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Database error while fetching foods
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get All Foods
      tags:
      - Food
    post:
      consumes:
      - multipart/form-data
      description: Create a new food item in the restaurant menu (Admin only)
      parameters:
      - description: Food Name
        in: formData
        name: name
        required: true
        type: string
      - description: Food Price
        in: formData
